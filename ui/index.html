<!doctype html>
<!--
  `lang` starts at the fallback and is corrected before the first paint by
  `/src/lib/i18n.ts`, which owns the language AND this attribute: a page whose copy
  says one language and whose `lang` says another is what a screen reader reads
  aloud wrongly. It cannot be written correctly here -- this file is static and the
  answer depends on the browser.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      THE TITLE BEFORE THE FIRST PAINT, and only before it: once the page runs,
      `/src/lib/session-title.ts` owns this string and rewrites it whenever the
      session on screen changes (`<the session's title> · clj-harness`). It cannot be
      written correctly here -- this file is static and the answer depends on which
      session the page lands on -- which is the same shape as `lang` above: a static
      fallback for the moment before the script, and a module that owns it after.
    -->
    <title>clj-harness</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      One import, and that is the whole entry.

      `/src/main.tsx` is the app: it mounts itself on load, so there is nothing
      to call from here, and it imports the stylesheet (./styles.css) itself, so
      the styles are named in exactly one place -- the entry module that owns
      them -- rather than split across this file and that one.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
